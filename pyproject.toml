readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.3.1",
    "fastapi[standard]>=0.139.2",
    "langchain-text-splitters>=1.1.2",
    "markitdown[pdf]>=0.1.6",
    "ollama>=0.6.2",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "redis>=8.0.1",
    "sqlmodel>=0.0.39",
]
